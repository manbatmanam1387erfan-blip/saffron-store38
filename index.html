<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>زعفران پریمیوم | فروش آنلاین</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* --- استایل‌های فروشگاه (همان نسخه قبلی) --- */
    :root{--bg:#fffaf5;--card:#ffffff;--text:#3a2e2a;--muted:#7a6a63;--primary:#ff7aa2;--accent:#ffd166;--mint:#b8e1c6;--lav:#c7b7ff;--shadow:0 10px 25px rgba(0,0,0,.08);--radius:18px}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,system-ui}
    a{text-decoration:none;color:inherit}
    body{opacity:0;animation:fadeIn .7s ease .1s forwards}
    @keyframes fadeIn{to{opacity:1}}
    header{position:sticky;top:0;z-index:1000;background:#fffaf5cc;border-bottom:1px solid #f0e7dd}
    .nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:18px;padding:12px 20px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
    .logo{width:36px;height:36px;border-radius:50%;background:conic-gradient(from 180deg,var(--primary),var(--lav),var(--accent),var(--mint),var(--primary))}
    .nav .tabs{margin-inline-start:auto;display:flex;gap:6px}
    .tab-btn{border:none;background:var(--card);padding:8px 14px;border-radius:999px;cursor:pointer}
    .tab-btn.active{background:linear-gradient(135deg,#ffe9f0,#fff3c9)}
    .pill{background:linear-gradient(90deg,var(--primary),var(--lav));color:white;border:none;border-radius:999px;padding:10px 16px;cursor:pointer}
    .hero{max-width:1100px;margin:24px auto;display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:0 20px}
    .hero-card{background:#fff;border-radius:var(--radius);padding:22px}
    .content{max-width:1100px;margin:10px auto 60px;padding:0 20px}
    .tab-panels{background:var(--card);border-radius:var(--radius);padding:18px}
    .panel{display:none}
    .panel.active{display:block}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
    .card{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow)}
    .mini-cart{position:fixed;bottom:18px;right:18px;background:#fff;border-radius:20px;padding:12px;box-shadow:var(--shadow)}
  </style>
</head>
<body>

  <header>
    <nav class="nav">
      <div class="brand"><div class="logo"></div><span>زعفران پریمیوم</span></div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="pack">بسته‌بندی</button>
        <button class="tab-btn" data-tab="bulk">فله</button>
        <button class="tab-btn" data-tab="extras">جانبی</button>
        <button class="tab-btn" data-tab="blog">بلاگ</button>
        <button class="tab-btn" data-tab="about">درباره</button>
      </div>
      <button class="pill">ورود</button>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-card">
      <h1>زعفران اصل ایران</h1>
      <p>ارسال سریع | ضمانت اصالت</p>
    </div>
    <div class="hero-card">🌸 تصویر هنری زعفران</div>
  </section>

  <main class="content">
    <div class="tab-panels">
      <section class="panel active" id="panel-pack"><div class="grid" id="grid-pack"></div></section>
      <section class="panel" id="panel-bulk"><div class="grid" id="grid-bulk"></div></section>
      <section class="panel" id="panel-extras"><div class="grid" id="grid-extras"></div></section>
      <section class="panel" id="panel-blog"><div id="blog-list"></div></section>
      <section class="panel" id="panel-about"><p>درباره ما...</p></section>
    </div>
  </main>

  <div class="mini-cart">
    <span id="cart-count">۰</span> آیتم | <span id="cart-sum">۰ تومان</span>
  </div>

  <!-- پنل مخفی ادمین -->
  <div id="admin-panel" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fffafed9;z-index:2000;padding:20px;overflow:auto">
    <h2>پنل مدیریت</h2>
    <button onclick="closeAdmin()">❌ بستن</button>
    <div style="margin-top:20px">
      <h3>ویرایش عنوان سایت</h3>
      <input id="site-title" type="text" value="زعفران پریمیوم">
      <button onclick="updateTitle()">ذخیره</button>
    </div>
    <div style="margin-top:20px">
      <h3>افزودن محصول</h3>
      <input id="new-title" placeholder="نام محصول">
      <input id="new-price" placeholder="قیمت">
      <button onclick="addProduct()">افزودن</button>
    </div>
  </div>

  <script>
    // محصولات نمونه
    const catalog = {
      pack:[{id:'p1',title:'زعفران نگین ۱ گرم',price:320000}],
      bulk:[{id:'b1',title:'زعفران فله ۱۰ گرم',price:2150000}],
      extras:[{id:'e1',title:'نبات زعفرانی',price:145000}],
      blog:[{title:'طرز دم کردن زعفران'}]
    };
    const cart={items:[],sum:0};

    function mount(){
      ['pack','bulk','extras'].forEach(key=>{
        const grid=document.getElementById(`grid-${key}`);
        grid.innerHTML='';
        catalog[key].forEach(item=>{
          const el=document.createElement('div');
          el.className='card';
          el.innerHTML=`<div>${item.title}</div><div>${item.price} تومان</div>
          <button onclick="addToCart('${item.id}')">افزودن</button>`;
          grid.appendChild(el);
        });
      });
      document.getElementById('blog-list').innerHTML=catalog.blog.map(b=>`<div class="card">${b.title}</div>`).join('');
    }
    mount();

    function addToCart(id){
      const item=Object.values(catalog).flat().find(x=>x.id===id);
      cart.items.push(item);cart.sum+=item.price;
      document.getElementById('cart-count').textContent=cart.items.length;
      document.getElementById('cart-sum').textContent=cart.sum+' تومان';
    }

    // تب‌ها
    document.querySelectorAll('.tab-btn').forEach(b=>{
      b.addEventListener('click',()=>{
        document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
        document.getElementById(`panel-${b.dataset.tab}`).classList.add('active');
      });
    });

    // پنل ادمین
    document.addEventListener('keydown',e=>{
      if(e.ctrlKey&&e.shiftKey&&e.key==='A'){
        const pass=prompt('رمز ورود پنل ادمین:');
        if(pass==='
